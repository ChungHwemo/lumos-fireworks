<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b1e25" />
    <title>日本花火マップ</title>
    <meta
      name="description"
      content="2026年9月4日以降の日本の花火大会。距離と規制をいっしょに見る非公式マップ。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="日本花火マップ" />
    <meta
      property="og:description"
      content="2026年9月4日以降の日本の花火大会。距離と規制をいっしょに見る非公式マップ。"
    />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:locale:alternate" content="ko_KR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 -960 960 960'%3E%3Crect width='960' height='960' y='-960' rx='160' fill='%231b1e25'/%3E%3Cpath fill='%23ff8a3d' d='M450-820h60v170h-60v-170Zm0 500h60v170h-60v-170Zm370-190v60H650v-60h170Zm-500 0v60H150v-60h170Zm372-282 42 42-120 120-42-42 120-120ZM268-310l42 42-120 120-42-42 120-120Zm424 302-120-120 42-42 120 120-42 42ZM190-732l120 120-42 42-120-120 42-42ZM480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560Z'/%3E%3C/svg%3E"
    />
    <!-- 타일·지형 서버는 첫 지도 화면에서 바로 두드린다. 핸드셰이크를 먼저 끝내 둔다. -->
    <link rel="preconnect" href="https://cyberjapandata.gsi.go.jp" crossorigin />
    <link rel="preconnect" href="https://s3.amazonaws.com" crossorigin />
    <script>
      // 첫 페인트 전에 화면 색을 정한다. 규칙은 src/ui/theme.ts 와 같다: 저장값 > 기기 설정.
      (function () {
        try {
          var pref = localStorage.getItem("hanabi-theme");
          var dark =
            pref === "dark" ||
            (pref !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#1b1e25" : "#f4f5f8");
          var lang = localStorage.getItem("hanabi-lang");
          if (lang === "ko" || lang === "en") document.documentElement.lang = lang;
        } catch (err) {
          /* 저장소가 막혀 있으면 기기 설정만 따른다 */
        }
      })();
      // GitHub Pages 사용자 사이트는 루트 404.html만 쓴다. 거기가 넘겨준 원래 경로를 되돌린다.
      (function () {
        try {
          var saved = sessionStorage.getItem("lumos-fireworks-path");
          if (!saved) return;
          sessionStorage.removeItem("lumos-fireworks-path");
          if (saved !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", saved);
          }
        } catch (err) {
          /* 세션 저장소가 막혀 있으면 목록으로 남는다 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1rem; font-family: sans-serif">この地図にはJavaScriptが必要です。</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
